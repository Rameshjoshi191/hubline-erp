# Render "Blueprint": one-click deploy of a FREE demo instance.
# Free instances sleep after ~15 minutes idle and their disk is wiped on every restart, so this file loads the
# demo data (SEED_DEMO) each time it wakes. Use it to show the system to colleagues - NOT for real company data.
# For real use see DEPLOY.md ("Going live with real data").
services:
  - type: web
    name: hubline-erp
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: ADMIN_PASSWORD      # generated by Render - read it in the dashboard under Environment
        generateValue: true
      - key: DEMO_PASSWORD       # password of the other demo users (ops, docs, accounts, sales, manager)
        generateValue: true
